# Reverse proxy Caddy — Phase 3.4
# Seule stack autorisée à écouter sur 0.0.0.0 (ports 80/443)
name: proxy

services:
  caddy:
    # TODO : remplacer par la version exacte relevée avec `docker compose exec caddy caddy version`
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificats et clés ACME : NE JAMAIS SUPPRIMER
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # écouter sur 80/443
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 200
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    environment:
      TZ: Europe/Paris
    networks: [proxy]

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
