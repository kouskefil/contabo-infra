# Durcissement SSH — Phase 1.5
# Cible : /etc/ssh/sshd_config.d/00-hardening.conf
# Préfixe 00 : sshd retient la PREMIÈRE valeur lue → prime sur 50-cloud-init.conf
# Appliquer : sudo sshd -t && sudo systemctl reload ssh

# Authentification : clé uniquement, pas de root
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Seul cet utilisateur peut se connecter
AllowUsers kouskefil

# Limiter le brute-force et les connexions inactives
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Fonctions inutiles sur ce serveur
# (AllowTcpForwarding laissé actif : tunnel PostgreSQL en Phase 4)
X11Forwarding no
AllowAgentForwarding no
