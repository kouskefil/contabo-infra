# PostgreSQL — Phase 4
# Données : volume postgres_data. Sauvegarde : pg_dump (Phase 4.3), jamais copie à chaud des fichiers.
name: postgres

services:
  postgres:
    # Version majeure 18 sur Debian (glibc : collations stables, contrairement à Alpine/musl)
    image: postgres:18.6-trixie
    restart: unless-stopped
    shm_size: 256mb               # défaut Docker 64 Mo : trop peu pour les requêtes parallèles
    # Local uniquement : accès admin depuis le Mac via tunnel SSH
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
      TZ: Europe/Paris
      PGTZ: Europe/Paris
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql   # images 18+ : PGDATA = /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    # Durcissement : l'entrypoint démarre en root puis bascule sur l'utilisateur postgres
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
          pids: 300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s        # laisser PostgreSQL écrire son checkpoint d'arrêt
    networks:
      db:
        aliases: [postgres]

secrets:
  postgres_password:
    file: ./secrets/postgres_password   # sur le serveur uniquement (chmod 600), ignoré par Git

volumes:
  postgres_data:

networks:
  db:
    external: true
