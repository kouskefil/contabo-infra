# Observabilité — Phases 6.2 (mesures), 6.3 (tableaux de bord), 6.4 (logs)
# Prometheus et Grafana ne sont accessibles qu'en local (tunnel SSH).
# Rien n'est exposé sur Internet.
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.5        # version LTS
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d   # on garde 30 jours d'historique
      - --storage.tsdb.retention.size=4GB   # garde-fou : jamais plus de 4 Go sur le disque
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle                # permet de recharger la config sans redémarrer
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 200
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    networks: [monitoring]

  # Lit les compteurs du noyau Linux et les publie au format Prometheus.
  node-exporter:
    image: prom/node-exporter:v1.12.0
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:                                 # lecture seule : il observe, il ne touche à rien
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 100
    networks: [monitoring]

  # Mesure la consommation de chaque conteneur Docker.
  # ⚠️ Nécessite un accès large en lecture à l'hôte : voir la note dans le message.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true                   # ignore les processus hors conteneurs
      - --housekeeping_interval=30s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 200
    networks: [monitoring]

  # Affiche les mesures. Accessible uniquement par tunnel SSH.
  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Grafana lit le mot de passe dans un fichier (suffixe __FILE), pas dans une variable
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"       # personne ne peut créer de compte
      GF_AUTH_ANONYMOUS_ENABLED: "false"    # aucun accès sans connexion
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      TZ: Europe/Paris
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 200
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 20s
    networks: [monitoring]

  # Stocke les logs. N'indexe que les étiquettes, pas le texte : très léger.
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200
    # Pas de healthcheck : l'image de Loki ne contient ni wget ni curl.
    # C'est Prometheus qui surveille Loki (job "loki" dans prometheus.yml).
    stop_grace_period: 30s
    networks: [monitoring]

  # Collecte les logs de tous les conteneurs et les pousse vers Loki.
  # ⚠️ Accède au socket Docker : voir la note dans le message.
  alloy:
    image: grafana/alloy:v1.20.0
    restart: unless-stopped
    # Root : nécessaire pour lire le socket Docker (root:docker) et écrire son
    # dossier d'état. Lire ce socket donne de toute façon un pouvoir équivalent
    # à root : le niveau de confiance est inchangé.
    user: "0:0"
    depends_on:
      loki:
        condition: service_started
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    cap_drop: [ALL]
    # /var/lib/alloy/data appartient à alloy:alloy en 770, y compris dans le volume
    # (Docker recopie les droits de l'image). Sans DAC_OVERRIDE, même root se voit
    # refuser l'accès : c'est la capacité qui permet d'ignorer les permissions.
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 200
    stop_grace_period: 20s
    networks: [monitoring]

  # Reçoit les alertes de Prometheus et les envoie sur Telegram.
  alertmanager:
    image: prom/alertmanager:v0.32.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - telegram_token
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 100
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    networks: [monitoring]

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  telegram_token:
    file: ./secrets/telegram_token

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  alertmanager_data:

networks:
  monitoring:
