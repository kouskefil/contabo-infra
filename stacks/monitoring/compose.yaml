# Observabilité — Phases 6.2 (mesures) et 6.3 (tableaux de bord)
# Prometheus et Grafana ne sont accessibles qu'en local (tunnel SSH).
# Rien n'est exposé sur Internet.
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.5        # version LTS
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d   # on garde 30 jours d'historique
      - --storage.tsdb.retention.size=4GB   # garde-fou : jamais plus de 4 Go sur le disque
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle                # permet de recharger la config sans redémarrer
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 200
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    networks: [monitoring]

  # Lit les compteurs du noyau Linux et les publie au format Prometheus.
  node-exporter:
    image: prom/node-exporter:v1.12.0
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:                                 # lecture seule : il observe, il ne touche à rien
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 100
    networks: [monitoring]

  # Mesure la consommation de chaque conteneur Docker.
  # ⚠️ Nécessite un accès large en lecture à l'hôte : voir la note dans le message.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true                   # ignore les processus hors conteneurs
      - --housekeeping_interval=30s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 200
    networks: [monitoring]

  # Affiche les mesures. Accessible uniquement par tunnel SSH.
  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Grafana lit le mot de passe dans un fichier (suffixe __FILE), pas dans une variable
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"       # personne ne peut créer de compte
      GF_AUTH_ANONYMOUS_ENABLED: "false"    # aucun accès sans connexion
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      TZ: Europe/Paris
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 200
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 20s
    networks: [monitoring]

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
