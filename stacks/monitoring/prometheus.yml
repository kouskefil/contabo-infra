# Prometheus — Phase 6.2
# Prometheus VA CHERCHER les mesures (il "scrape") : chaque cible expose une page
# texte, Prometheus la lit toutes les 30 s et conserve l'historique.

global:
  scrape_interval: 30s        # fréquence de relevé
  scrape_timeout: 10s
  external_labels:
    serveur: contabo-vps

# Où envoyer les alertes déclenchées
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Les règles qui définissent ce qui est un problème
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # 1. Prometheus se surveille lui-même
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 2. La machine : processeur, mémoire, disque, charge, réseau
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Les conteneurs : mémoire et CPU par conteneur
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. Les composants de surveillance eux-mêmes : qui surveille le surveillant ?
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
  - job_name: sondes-publiques
    metrics_path: /probe
    scrape_timeout: 10s
    params:
      module: [http_200]
    static_configs:
      - targets:
          - https://demo.kouskefil.tech
          - https://api.kouskefil.tech/ws/clients.wsdl
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: sondes-protegees
    metrics_path: /probe
    scrape_timeout: 10s
    params:
      module: [http_401]
    static_configs:
      - targets:
          - https://api.kouskefil.tech/taches
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]